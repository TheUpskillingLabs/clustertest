name: 🐛 Bug
description: The tool did something wrong (an error, a broken control, lost work, a rendering glitch).
title: "🐛 "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the tool actually do?
      placeholder: "I clicked Produce the deck & site and nothing downloaded…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: "A .zip download and the Git handoff panel."
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Which screen / state
      options:
        - Intro deck
        - Sources
        - Sorting
        - Canvas — Seed Mode
        - Canvas — after Unlock (Pod Mode)
        - Canvas — classify
        - Deepen workbook
        - Share / Export
        - The exported site or deck
        - Other / not sure
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device + browser
      placeholder: "MacBook / Chrome 130 · or · iPhone 15 / Safari"
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (drag & drop an image here)
      description: A picture of the screen at the moment it went wrong is worth everything.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      placeholder: "It happened right after I imported a podmate's folder…"
