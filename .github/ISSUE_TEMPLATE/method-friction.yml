name: 🧠 Method friction
description: The tool worked, but a person got stuck, confused, or discouraged. The most valuable report we get.
title: "🧠 "
labels: ["method-friction"]
body:
  - type: markdown
    attributes:
      value: |
        When the process trips someone, that's a signal about the process — never a mark against the member.
        Verbatim quotes are gold. You don't need a proposed fix; the observation is the contribution.
  - type: textarea
    id: trying
    attributes:
      label: What were they trying to do?
      placeholder: "Connect two extracts into an Evidence card."
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What actually happened — and what did they say?
      description: Quote them if you can.
      placeholder: "They hovered around the card for a while and said 'I don't see how you attach these.' They hadn't noticed the dots."
    validations:
      required: true
  - type: textarea
    id: unblock
    attributes:
      label: What did you say or do to unblock them?
      placeholder: "Showed the Link tool in the dock — that clicked immediately."
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Where in the flow
      options:
        - Intro / first impressions
        - Sources (getting data in)
        - Sorting
        - Connecting on the canvas
        - The Unlock (graduation) moment
        - Naming / the locks
        - Mapping the Problem Situation
        - Classify (seven types)
        - Deepen workbook (incl. paradox stage)
        - Export / Git loop
        - The method itself (not the tool)
    validations:
      required: true
  - type: dropdown
    id: often
    attributes:
      label: How often have you seen this?
      options:
        - First time
        - A few people now
        - Nearly everyone hits this
