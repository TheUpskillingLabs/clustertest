name: ✨ Sprint idea
description: A proposal for the Sensemaking Sprint co-design (docs/SENSEMAKING-SPRINT.md).
title: "✨ "
labels: ["sprint-codesign"]
body:
  - type: dropdown
    id: question
    attributes:
      label: Which open question does this address?
      description: From the sprint brief (docs/SENSEMAKING-SPRINT.md).
      options:
        - Q1 — The event's name
        - Q2 — Evening slot vs full-day format
        - Q3 — Solo boards vs shared / when the first merge happens
        - Q4 — Extraction before or during
        - Q5 — What pods must present at Meet the Pods
        - Q6 — Pod formation mechanics
        - Q7 — Device policy
        - Q8 — The survey → tool bridge (CSV handoff)
        - Something else about the sprint
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: What should we do, concretely?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why — especially anything you've seen in the field
      placeholder: "At the kickoff, most people had phones only, so…"
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: What it costs / what breaks
      placeholder: "Needs the library room for a full day; the evening-only folks lose…"
